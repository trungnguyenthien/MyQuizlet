<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MyQuizlet — Automated Unit & Acceptance Tests</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      background: #FAFAFA;
      color: #212121;
      max-width: 860px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    .summary {
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .summary.pass {
      background: #E8F5E9;
      color: #2E7D32;
    }
    .summary.fail {
      background: #FFEBEE;
      color: #C62828;
    }
    .test-case {
      padding: 10px 14px;
      border-radius: 6px;
      background: #FFF;
      border: 1px solid #E0E0E0;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .test-name {
      font-size: 0.95rem;
    }
    .badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .badge.pass {
      background: #E8F5E9;
      color: #2E7D32;
    }
    .badge.fail {
      background: #FFEBEE;
      color: #C62828;
    }
    .err-msg {
      color: #C62828;
      font-size: 0.85rem;
      margin-top: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>MyQuizlet Test Suite</h1>
  <div id="summary" class="summary">Running tests...</div>
  <div id="results"></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>

  <script type="module">
    import { parseMarkdownSet } from './js/parser.js';
    import { serializeSet, slugify } from './js/serializer.js';
    import { store } from './js/store.js';
    import { renderCardFaceHTML } from './js/render.js';
    import { ui } from './js/ui.js';
    import { StudyController } from './js/study.js';

    const resultsContainer = document.getElementById('results');
    const summaryEl = document.getElementById('summary');
    let passed = 0;
    let failed = 0;

    async function runTest(name, fn) {
      const item = document.createElement('div');
      item.className = 'test-case';
      try {
        await fn();
        passed++;
        item.innerHTML = `<span class="test-name">✓ ${name}</span><span class="badge pass">PASS</span>`;
      } catch (err) {
        failed++;
        console.error(`[FAIL] ${name}:`, err);
        item.innerHTML = `<div><span class="test-name">✗ ${name}</span><div class="err-msg">${err.message}</div></div><span class="badge fail">FAIL</span>`;
      }
      resultsContainer.appendChild(item);
    }

    async function main() {
      // 1. Fetch sample.md
      const resp = await fetch('samples/sample.md');
      const sampleText = await resp.text();

      // Test 1: Acceptance test 1 - sample.md parse count, title, and warning
      await runTest('Acceptance Test 1: Import sample.md produces 7 cards, title, and 1 empty answer warning', () => {
        const { set, warnings } = parseMarkdownSet(sampleText, 'sample.md');
        console.assert(set.title === 'Swift & Web Development Mastery', `Expected title 'Swift & Web Development Mastery', got '${set.title}'`);
        console.assert(set.cards.length === 7, `Expected 7 cards, got ${set.cards.length}`);
        console.assert(warnings.length === 1, `Expected exactly 1 warning, got ${warnings.length}`);
        console.assert(warnings[0].includes('empty answer') || warnings[0].includes('đáp án trống'), `Expected empty answer warning, got ${warnings[0]}`);
      });

      // Test 2: Acceptance test 2 - Fenced code with '---' and '## ' does not split card
      await runTest('Acceptance Test 2: Inner "---" and "## " inside fenced code blocks do not split cards', () => {
        const { set } = parseMarkdownSet(sampleText, 'sample.md');
        const codeCard = set.cards.find(c => c.q.includes('nested separators'));
        console.assert(Boolean(codeCard), 'Could not find card with nested separators');
        console.assert(codeCard.a.includes('```markdown'), 'Answer should contain fenced code block');
        console.assert(codeCard.a.includes('let separator = "---"'), 'Answer should contain code body');
        console.assert(codeCard.a.includes('## not a question'), 'Answer should contain ## not a question inside fence');
      });

      // Test 3: Acceptance test 3 - Round trip parse(serialize(parse(x))) deep equals parse(x)
      await runTest('Acceptance Test 3: Round-trip export then re-import yields identical set content', () => {
        const first = parseMarkdownSet(sampleText, 'sample.md');
        const serialized = serializeSet(first.set);
        const second = parseMarkdownSet(serialized, 'sample.md');

        console.assert(first.set.title === second.set.title, 'Titles must match after round trip');
        console.assert(first.set.cards.length === second.set.cards.length, 'Card counts must match');
        for (let i = 0; i < first.set.cards.length; i++) {
          console.assert(first.set.cards[i].q === second.set.cards[i].q, `Question ${i} mismatch`);
          console.assert(first.set.cards[i].a === second.set.cards[i].a, `Answer ${i} mismatch`);
        }
      });

      // Test 4: Missing title fallback to filename
      await runTest('Parser Fallback: Missing title header uses filename and logs warning', () => {
        const raw = `## Question 1\nAnswer 1\n---`;
        const { set, warnings } = parseMarkdownSet(raw, 'Biology-101.md');
        console.assert(set.title === 'Biology-101', `Expected 'Biology-101', got '${set.title}'`);
        console.assert(warnings.length > 0, 'Should warn about missing title');
      });

      // Test 5: Empty block without question skipped
      await runTest('Parser Validation: Block without question is skipped with warning', () => {
        const raw = `---\n# Test Deck\n---\nJust some random text without question\n---\n## Valid Q\nValid A\n---`;
        const { set, warnings } = parseMarkdownSet(raw);
        console.assert(set.cards.length === 1, `Expected 1 card, got ${set.cards.length}`);
        console.assert(warnings.some(w => w.includes('Skipped') || w.includes('bỏ qua')), 'Should warn about skipped block');
      });

      // Test 6: Slugify safety
      await runTest('Serializer: Slugify handles Unicode and illegal characters safely', () => {
        const slug = slugify('Ôn tập Swift / iOS : Level 1?');
        console.assert(!/[\\/:*?"<>|]/.test(slug), 'Slug must not contain illegal chars');
        console.assert(slug.includes('Ôn-tập-Swift'), `Slug expected Unicode support, got ${slug}`);
      });

      // Test 7: Store save, rename, and delete with undo
      await runTest('Store: Save, rename validation, and 6-second soft delete undo', () => {
        const testSet = {
          id: 'test-set-123',
          title: 'Initial Title',
          allowAnswer: true,
          cards: [{ id: 'c1', q: 'Q1', a: 'A1' }]
        };
        store.saveSet(testSet);
        const retrieved = store.getSet('test-set-123');
        console.assert(retrieved && retrieved.title === 'Initial Title', 'Save set failed');

        // Rename
        store.renameSet('test-set-123', 'Updated Title');
        console.assert(store.getSet('test-set-123').title === 'Updated Title', 'Rename failed');

        // Rename validation (empty rejected)
        let rejected = false;
        try {
          store.renameSet('test-set-123', '   ');
        } catch {
          rejected = true;
        }
        console.assert(rejected, 'Empty title should be rejected');

        // Delete with undo
        const delRes = store.deleteSet('test-set-123');
        console.assert(!store.getSet('test-set-123'), 'Set should be deleted from storage');
        const restored = store.undoDelete();
        console.assert(restored && restored.id === 'test-set-123', 'Undo delete should restore set');
        console.assert(Boolean(store.getSet('test-set-123')), 'Restored set must exist in storage');

        // Cleanup
        store.deleteSet('test-set-123');
        delRes.cancelUndo();
      });

      // Test 8: Shuffle bag logic (all cards seen before repeat)
      await runTest('Study: Shuffle bag exhaustiveness and no consecutive repeats across cycles', () => {
        const n = 5;
        const indices = Array.from({ length: n }, (_, i) => i);
        const seen = new Set();
        // simulate bag
        const bag = [...indices];
        for (let i = 0; i < n; i++) {
          const card = bag.pop();
          seen.add(card);
        }
        console.assert(seen.size === n, 'All cards must be drawn in one cycle');
      });

      // Test 9: Edit Full Set Markdown Workflow
      await runTest('Edit Markdown: Direct set markdown update synchronizes title, cards and store', () => {
        const setId = 'test-edit-md-set';
        const initialSet = {
          id: setId,
          title: 'Initial Subject',
          allowAnswer: true,
          cards: [
            { id: 'c1', q: 'Original Q1', a: 'Original A1' },
            { id: 'c2', q: 'Original Q2', a: 'Original A2' }
          ]
        };
        store.saveSet(initialSet);

        // 1. Serialize current set to Markdown
        const exportedMd = serializeSet(initialSet);
        console.assert(exportedMd.includes('# Initial Subject'), 'Serialized Markdown must contain initial title');

        // 2. User edits markdown: changes title, modifies Q1, adds Q3 with code fence
        const editedMd = exportedMd
          .replace('# Initial Subject', '# Advanced Algorithms')
          .replace('Original Q1', 'Updated Graph Q1')
          + `\n## New DFS Question\n\n\`\`\`swift\nfunc dfs() {}\n\`\`\`\n---`;

        // 3. Parse updated markdown
        const { set: parsed, warnings } = parseMarkdownSet(editedMd, initialSet.title);
        console.assert(parsed.title === 'Advanced Algorithms', `Expected title 'Advanced Algorithms', got '${parsed.title}'`);
        console.assert(parsed.cards.length === 3, `Expected 3 cards after editing, got ${parsed.cards.length}`);

        // 4. Save back into store
        const targetSet = store.getSet(setId);
        targetSet.title = parsed.title;
        targetSet.cards = parsed.cards;
        targetSet.updatedAt = Date.now();
        store.saveSet(targetSet);

        // 5. Verify store state
        const stored = store.getSet(setId);
        console.assert(stored.title === 'Advanced Algorithms', 'Stored title must match edited title');
        console.assert(stored.cards.length === 3, 'Stored card count must match edited count');
        console.assert(stored.cards[0].q === 'Updated Graph Q1', 'First question must be updated');
        console.assert(stored.cards[2].q === 'New DFS Question', 'Third question must be present');
        console.assert(stored.cards[2].a.includes('```swift'), 'Third card answer must preserve code block');

        // Cleanup
        store.deleteSet(setId);
      });

      // Test 10: Edit Markdown live validation & warnings
      await runTest('Edit Markdown Validation: Detects empty answers, missing headers, and malformed blocks', () => {
        const malformedMd = `---\n# Incomplete Set\n---\n## Question with empty answer\n\n---\nBlock without question\n---`;
        const { set: parsed, warnings } = parseMarkdownSet(malformedMd);
        console.assert(parsed.cards.length === 1, 'Only 1 valid card should be recognized');
        console.assert(warnings.length >= 2, `Expected at least 2 warnings, got ${warnings.length}`);
        console.assert(warnings.some(w => w.includes('empty answer') || w.includes('đáp án trống')), 'Warning for empty answer expected');
        console.assert(warnings.some(w => w.includes('Skipped') || w.includes('bỏ qua')), 'Warning for skipped block expected');
      });

      // Test 11: Header2-only format without '---' card separators
      await runTest('Format Update: Header2-only format without "---" parses questions and answers cleanly', () => {
        const noDashesMd = `# Vocabulary Deck

## Ephemeral
Lasting for a very short time.

## Serendipity
The occurrence of events by chance in a happy or beneficial way.

## Code Example
Here is how to write Markdown:
\`\`\`markdown
## Not a question
Just code
\`\`\`

## Ubiquitous
Present, appearing, or found everywhere.`;

        const { set, warnings } = parseMarkdownSet(noDashesMd);
        console.assert(set.title === 'Vocabulary Deck', `Expected 'Vocabulary Deck', got '${set.title}'`);
        console.assert(set.cards.length === 4, `Expected 4 cards, got ${set.cards.length}`);
        console.assert(set.cards[0].q === 'Ephemeral', `Expected 'Ephemeral', got '${set.cards[0].q}'`);
        console.assert(set.cards[0].a === 'Lasting for a very short time.', `Unexpected answer 0: '${set.cards[0].a}'`);
        console.assert(set.cards[2].q === 'Code Example', `Expected 'Code Example', got '${set.cards[2].q}'`);
        console.assert(set.cards[2].a.includes('## Not a question'), 'Code block should preserve inner ##');
        console.assert(set.cards[3].q === 'Ubiquitous', `Expected 'Ubiquitous', got '${set.cards[3].q}'`);
        console.assert(warnings.length === 0, `Expected 0 warnings, got ${warnings.length}`);

        // Also test serializeSet on this deck
        const exported = serializeSet(set);
        console.assert(!exported.includes('---'), 'Exported markdown must not contain "---" separators');
        console.assert(exported.includes('# Vocabulary Deck'), 'Exported markdown must contain title');
        console.assert(exported.includes('## Ephemeral'), 'Exported markdown must contain questions');
      });

      // Test 12: Header2-only questions without pre-existing answers
      await runTest('Question-only Deck: Consecutive "## " headers without answers parse, render, and round-trip faithfully', () => {
        const questionOnlyMd = `# Technical Interview Checklist

## What is the event loop in JavaScript?
## How does prototypal inheritance differ from classical inheritance?
## Explain Closures and provide a memory leak scenario
## What are Microtasks vs Macrotasks?
## What is the Virtual DOM and how does reconciliation work?`;

        const { set, warnings } = parseMarkdownSet(questionOnlyMd, 'Tech-Interview.md');
        console.assert(set.title === 'Technical Interview Checklist', `Expected title 'Technical Interview Checklist', got '${set.title}'`);
        console.assert(set.cards.length === 5, `Expected 5 cards, got ${set.cards.length}`);
        
        // All cards should have q populated and a === ''
        for (let i = 0; i < set.cards.length; i++) {
          console.assert(Boolean(set.cards[i].q), `Card ${i} should have a question`);
          console.assert(set.cards[i].a === '', `Card ${i} should have an empty answer string`);
        }
        console.assert(warnings.length === 5, `Expected 5 informational empty-answer warnings, got ${warnings.length}`);

        // Verify face rendering
        const frontHtml = renderCardFaceHTML(set.cards[0], 'q');
        console.assert(frontHtml.includes('event loop'), 'Front face must contain question content');

        const backHtml = renderCardFaceHTML(set.cards[0], 'a');
        console.assert(backHtml.includes('empty-answer-placeholder'), 'Back face must render placeholder container');
        console.assert(backHtml.includes('empty-answer-title'), 'Back face must render placeholder title');

        // Verify serialization round-trip
        const exported = serializeSet(set);
        console.assert(exported.includes('# Technical Interview Checklist'), 'Exported markdown must contain deck title');
        console.assert(exported.includes('## What is the event loop in JavaScript?'), 'Exported markdown must contain card 1');
        console.assert(exported.includes('## What are Microtasks vs Macrotasks?'), 'Exported markdown must contain card 4');

        const reimported = parseMarkdownSet(exported, 'Tech-Interview.md');
        console.assert(reimported.set.cards.length === 5, `Round-trip card count should be 5, got ${reimported.set.cards.length}`);
        for (let i = 0; i < 5; i++) {
          console.assert(reimported.set.cards[i].q === set.cards[i].q, `Question ${i} mismatch after round-trip`);
          console.assert(reimported.set.cards[i].a === '', `Answer ${i} should remain empty after round-trip`);
        }

        // Verify storage
        store.saveSet(set);
        const stored = store.getSet(set.id);
        console.assert(stored && stored.cards.length === 5, 'Stored set must contain all 5 question-only cards');
        store.deleteSet(set.id);
      });

      // Test 13: Edit Markdown Dialog 'Replace from clipboard' button test
      await runTest('Edit Markdown: "Replace from clipboard" button exists and updates content from clipboard', async () => {
        const testSet = {
          id: 'test-clipboard-set',
          title: 'Initial Title',
          cards: [{ id: 'c1', q: 'Initial Question', a: 'Initial Answer' }]
        };

        // Mock navigator.clipboard
        const originalClipboard = navigator.clipboard;
        const clipboardMockText = `# New Clipboard Deck\n\n## Clipboard Q1\nClipboard A1\n\n## Clipboard Q2\nClipboard A2`;
        Object.defineProperty(navigator, 'clipboard', {
          value: {
            readText: async () => clipboardMockText
          },
          configurable: true,
          writable: true
        });

        ui.showEditMarkdownDialog({
          set: testSet,
          onSave: () => {}
        });

        const dialog = document.querySelector('.edit-markdown-dialog');
        console.assert(Boolean(dialog), 'Dialog should be appended to body');

        const clipboardBtn = dialog.querySelector('#edit-md-btn-clipboard');
        console.assert(Boolean(clipboardBtn), 'Replace from clipboard button must exist');
        console.assert(clipboardBtn.textContent.includes('Replace from clipboard'), 'Button text must contain "Replace from clipboard"');

        const textarea = dialog.querySelector('#edit-md-textarea');
        console.assert(textarea.value.includes('Initial Question'), 'Initial content must be present in textarea');

        // Click clipboard button
        clipboardBtn.click();

        // Wait a tick for async readText
        await new Promise(resolve => setTimeout(resolve, 60));

        console.assert(textarea.value === clipboardMockText, 'Textarea value should be replaced with clipboard content');

        const countChip = dialog.querySelector('#edit-md-count-chip');
        console.assert(countChip.textContent.includes('2'), `Count chip should show 2 cards, got: ${countChip.textContent}`);

        // Cleanup dialog
        dialog.querySelector('#edit-md-close-btn').click();

        // Restore clipboard
        Object.defineProperty(navigator, 'clipboard', {
          value: originalClipboard,
          configurable: true,
          writable: true
        });
      });

      // Test 14: Study Progress Store Persistence
      await runTest('Study Progress: saveStudyProgress, getStudyProgress validation, and clearStudyProgress', () => {
        const testSet = {
          id: 'test-progress-store-set',
          title: 'Store Progress Deck',
          cards: [
            { id: '1', q: 'Q1', a: 'A1' },
            { id: '2', q: 'Q2', a: 'A2' },
            { id: '3', q: 'Q3', a: 'A3' },
            { id: '4', q: 'Q4', a: 'A4' },
            { id: '5', q: 'Q5', a: 'A5' }
          ]
        };
        store.saveSet(testSet);

        const progress = {
          cardOrder: [4, 2, 0, 1, 3],
          currentIndex: 2,
          totalCards: 5
        };
        store.saveStudyProgress(testSet.id, progress);

        const loaded = store.getStudyProgress(testSet.id);
        console.assert(Boolean(loaded), 'Saved progress must be retrieved from store');
        console.assert(loaded.currentIndex === 2, `Expected currentIndex 2, got ${loaded.currentIndex}`);
        console.assert(loaded.totalCards === 5, `Expected totalCards 5, got ${loaded.totalCards}`);
        console.assert(JSON.stringify(loaded.cardOrder) === JSON.stringify([4, 2, 0, 1, 3]), 'Card order must match exactly');

        // Test invalidation when set card count is altered
        const modifiedSet = { ...testSet, cards: [...testSet.cards, { id: '6', q: 'Q6', a: 'A6' }] };
        store.saveSet(modifiedSet);
        const outOfSync = store.getStudyProgress(testSet.id);
        console.assert(outOfSync === null, 'Out of sync progress must be automatically invalidated and return null');

        // Re-save with 5 cards and test clearStudyProgress
        store.saveSet(testSet);
        store.saveStudyProgress(testSet.id, progress);
        store.clearStudyProgress(testSet.id);
        console.assert(store.getStudyProgress(testSet.id) === null, 'Cleared progress must return null');

        store.deleteSet(testSet.id);
      });

      // Test 15: Study Resume Dialog and Controller State Restoration
      await runTest('Study Resume Dialog: Renders "Start mới" and "Tiếp tục tiến trình cũ" with accurate callbacks', async () => {
        const testSet = {
          id: 'test-resume-dialog-set',
          title: 'Resume Dialog Test Deck',
          cards: Array.from({ length: 10 }, (_, i) => ({ id: `card-${i}`, q: `Question ${i + 1}`, a: `Answer ${i + 1}` }))
        };
        store.saveSet(testSet);

        const savedProgress = {
          cardOrder: [9, 8, 7, 6, 5, 4, 3, 2, 1, 0],
          currentIndex: 4, // 5th card seen (5/10)
          totalCards: 10
        };
        store.saveStudyProgress(testSet.id, savedProgress);

        let resumeCalled = false;
        let restartCalled = false;

        ui.showStudyResumeDialog({
          set: testSet,
          progress: savedProgress,
          onResume: () => { resumeCalled = true; },
          onRestart: () => { restartCalled = true; },
          onCancel: () => {}
        });

        const dialog = document.querySelector('.study-resume-dialog');
        console.assert(Boolean(dialog), 'Study resume dialog should be rendered in DOM');

        const continueBtn = dialog.querySelector('#resume-btn-continue');
        const restartBtn = dialog.querySelector('#resume-btn-restart');
        console.assert(Boolean(continueBtn), 'Continue previous progress button must exist');
        console.assert(Boolean(restartBtn), 'Start fresh button must exist');

        console.assert(continueBtn.textContent.includes('5/10') || continueBtn.textContent.includes('5 / 10'), `Continue button must include "5/10", got: ${continueBtn.textContent}`);
        console.assert(restartBtn.textContent.includes('Start mới') || restartBtn.textContent.includes('Start new'), `Restart button must include "Start mới", got: ${restartBtn.textContent}`);

        // Click continue button
        continueBtn.click();
        console.assert(resumeCalled === true, 'onResume callback must be fired when clicking continue');

        // Verify StudyController restores exact state when resume: true
        const dummyContainer = document.createElement('div');
        const controller = new StudyController({
          container: dummyContainer,
          onBack: () => {},
          onShowSnackbar: () => {}
        });

        controller.start(testSet.id, { resume: true });
        console.assert(controller.currentIndex === 4, `Controller currentIndex should be 4, got ${controller.currentIndex}`);
        console.assert(controller.cardOrder[4] === 5, `Controller cardOrder at index 4 should be 5, got ${controller.cardOrder[4]}`);

        controller.destroy();
        store.deleteSet(testSet.id);
      });

      // Update Summary
      summaryEl.textContent = `Completed ${passed + failed} tests: ${passed} Passed, ${failed} Failed.`;
      summaryEl.className = failed === 0 ? 'summary pass' : 'summary fail';
    }

    main();
  </script>
</body>
</html>
